<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Portfolio - Home</title>
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
      <!-- Include Header -->
  <div id="header"></div>
  <script>
    fetch('/templates/header.html')
      .then(response => response.text())
      .then(data => {
        document.getElementById('header').innerHTML = data;
      });

    // Include Footer
    fetch('/templates/footer.html')
      .then(response => response.text())
      .then(data => {
        document.getElementById('footer').innerHTML = data;
      });
  </script>

  <!-- Include Footer -->
  <div id="footer"></div>

    <section>
        <h1>Welcome to My Portfolio</h1>
        <p>This is my homepage where I showcase my ideas.</p>
    </section>

     <section id="portfolio">
        <h2>My Work</h2>
        <div class="gallery">
                <h1> <b><i><u> Innovation </u></i></b></h1>

            <img src="assets/images/image1.jpg" alt="innovation">

            <h1> <b><i><u> Hard Work </u></i></b></h1>
            <img src="assets/images/image2.jpg" alt="Hard Work">

            <h1> <b><i><u> Aim </u></i></b></h1>

            <img src="assets/images/image3.jpg" alt="Aim">
        </div>
    </section>
     <div id="footer-placeholder"></div>
</body>
</html>
